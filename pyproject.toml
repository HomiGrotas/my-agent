[project]
name = "my-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "homigrotas", email = "homigrotas2020@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "logfire>=5.1.0",
    "pydantic-ai>=2.45.0",
